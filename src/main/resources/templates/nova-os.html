<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Ordem de Serviço</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <span class="navbar-brand mb-0 h1">Oficina - Gestão de O.S.</span>
        <a href="/" class="btn btn-sm btn-outline-light">Voltar</a>
    </div>
</nav>

<div class="container pb-5">
    <div class="card shadow-sm">
        <div class="card-body">
            <h4 class="card-title text-primary mb-4">Registar Novo Serviço</h4>

            <form action="/nova-os" method="post">
                <h6 class="text-muted border-bottom pb-2">Dados do Veículo</h6>
                <div class="mb-3">
                    <label class="form-label">Matrícula</label>
                    <input type="text" class="form-control" name="matricula" required placeholder="Ex: ABC-1234">
                </div>
                <div class="mb-3">
                    <label class="form-label">Marca e Modelo</label>
                    <input type="text" class="form-control" name="marcaModelo" required placeholder="Ex: Ford Mondeo">
                </div>
                <div class="mb-4">
                    <label class="form-label">Cliente (Opcional)</label>
                    <input type="text" class="form-control" name="clienteReferencia" placeholder="Nome do dono">
                </div>

                <h6 class="text-muted border-bottom pb-2">Detalhes do Serviço</h6>
                <div class="mb-3">
                    <label class="form-label">Descrição da Reparação</label>
                    <textarea class="form-control" name="descricao" rows="3" required placeholder="Peças trocadas e serviços feitos..."></textarea>
                </div>
                <div class="mb-4">
                    <label class="form-label">Valor Total (R$)</label>
                    <input type="number" step="0.01" class="form-control" name="valorTotal" required placeholder="0.00">
                </div>

                <button type="submit" class="btn btn-success w-100 py-2">Guardar Ordem de Serviço</button>
            </form>
        </div>
    </div>
</div>
<style>
    /* Fundo num tom de cinza chumbo, muito mais suave que o preto puro */
    body.alto-contraste {
        background-color: #212529 !important;
        color: #f8f9fa !important;
    }

    /* Linhas da tabela num cinza médio para dar estrutura sem berrar */
    body.alto-contraste div,
    body.alto-contraste table,
    body.alto-contraste tbody,
    body.alto-contraste tr,
    body.alto-contraste td,
    body.alto-contraste header,
    body.alto-contraste footer {
        background-color: transparent !important;
        color: #f8f9fa !important;
        border-color: #495057 !important;
    }

    /* Destaques em Ciano (Azul Claro) */
    body.alto-contraste h1,
    body.alto-contraste h2,
    body.alto-contraste h3,
    body.alto-contraste h4,
    body.alto-contraste th {
        color: #0dcaf0 !important;
        background-color: transparent !important;
        border-bottom: 2px solid #0dcaf0 !important;
    }

    /* Botões modernos em Ciano com texto escuro */
    body.alto-contraste button,
    body.alto-contraste .btn,
    body.alto-contraste a.btn {
        background-color: #0dcaf0 !important;
        color: #000000 !important;
        font-weight: bold !important;
        border: none !important;
        border-radius: 6px !important;
        box-shadow: 0 4px 6px rgba(0,0,0,0.3) !important;
    }
</style>

<!-- Botão flutuante chamando a nova função JavaScript -->
<button onclick="alternarAltoContraste()"
        style="position: fixed; bottom: 20px; right: 20px; padding: 12px 20px; background-color: #343a40; color: #0dcaf0; border: 2px solid #0dcaf0; border-radius: 6px; cursor: pointer; z-index: 9999; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.5);">
    Alternar Alto Contraste
</button>

<!-- Script que gerencia a memória do Alto Contraste -->
<script>
    // 1. Assim que a página carrega, verifica se o modo já estava ativado no navegador
    if (localStorage.getItem('modoAltoContraste') === 'ativado') {
        document.body.classList.add('alto-contraste');
    }

    // 2. Função que liga/desliga o modo e salva a escolha para as outras páginas
    function alternarAltoContraste() {
        const corpo = document.body;
        corpo.classList.toggle('alto-contraste');

        // Se ativou, salva no Local Storage. Se desativou, remove.
        if (corpo.classList.contains('alto-contraste')) {
            localStorage.setItem('modoAltoContraste', 'ativado');
        } else {
            localStorage.setItem('modoAltoContraste', 'desativado');
        }
    }
</script>
</body>
</html>
